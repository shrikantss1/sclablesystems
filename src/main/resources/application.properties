spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/instagram_demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=sb
AWS_PROFILE=instagram-demo
AWS_REGION=eu-north-1
app.aws.profile=${AWS_PROFILE:}
app.aws.s3.bucket-name=${AWS_S3_BUCKET:instagram-demo-bucket}
app.aws.s3.region=${AWS_REGION:us-east-1}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
