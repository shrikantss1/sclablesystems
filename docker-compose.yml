services:
  coordinator:
    build: .
    image: instagram-citus:local
    environment: &postgres-environment
      POSTGRES_DB: instagram_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      CITUS_NODE_ROLE: coordinator
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instagram_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker-1:
    image: instagram-citus:local
    build: .
    environment:
      <<: *postgres-environment
      CITUS_NODE_ROLE: worker
    volumes:
      - citus-worker-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instagram_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker-2:
    image: instagram-citus:local
    build: .
    environment:
      <<: *postgres-environment
      CITUS_NODE_ROLE: worker
    volumes:
      - citus-worker-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instagram_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  citus-coordinator-data:
  citus-worker-1-data:
  citus-worker-2-data: